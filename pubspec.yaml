name: sikam
description: SIKAM - Sistem Informasi Kambing
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.1

  # State Management
  provider: ^6.1.2

  # HTTP Client
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.2

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.69.0

  # QR Code
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.19.0
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  flutter_advanced_drawer: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
